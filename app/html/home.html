<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./css/polaris.css?v=9" type="text/css" rel="stylesheet">
    <link rel="icon" href="https://images-ext-1.discordapp.net/external/vsh7pbxkoonbodZ8hUBafIy4eiJ6oKGEZKgZcADdfkg/%3Fsize%3D2048/https/cdn.discordapp.com/icons/1093864130030612521/aaa49d9f23bce2e8b18a417cfab2b72a.png?format=webp&amp;quality=lossless">
    <title>TS Community</title>
    <meta property="og:title" content="TS Community">
    <meta property="og:description" content="Sistema de niveles de TS Community">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#00ff80">
    <meta name="twitter:card" content="summary">
    <style>
        body {
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 128, 0.16), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(59, 136, 195, 0.18), transparent 45%),
                var(--bg);
        }

        .heroWrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .heroBgLogo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 900px;
            height: 900px;
            object-fit: cover;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            filter: blur(90px);
            opacity: 30%;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .heroCard {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 55px 65px;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        .heroLogoWrap {
            padding: 4px;
            border-radius: 50%;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--polarisgreen), var(--emojiblue));
            box-shadow: 0 0 40px rgba(0, 255, 128, 0.35);
        }

        .heroLogoWrap img {
            display: block;
            height: 120px;
            width: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--bg);
            user-select: none;
        }

        .heroTitle {
            font-family: var(--opensans);
            font-weight: 800;
            font-size: 44px;
            margin: 0px 0px 12px 0px;
            background: linear-gradient(135deg, var(--polarisgreen), var(--emojiblue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .heroSubtitle {
            font-size: 19px;
            line-height: 28px;
            margin: 0px 0px 32px 0px;
            opacity: 75%;
        }

        .heroButtons {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 16px;
        }

        .heroButtons a {
            text-decoration: none !important;
        }

        .gradientButton {
            font-family: var(--opensans);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            min-width: 170px;
            padding: 0px 26px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            color: #0b1210;
            text-decoration: none;
            cursor: pointer;
            transition-duration: 0.2s;
            transition-property: transform, box-shadow, filter;
        }

        .gradientButton svg {
            height: 20px;
            width: 20px;
            flex-shrink: 0;
        }

        .gradientButton.primary {
            background: linear-gradient(135deg, var(--polarisgreen), #00c48c);
            box-shadow: 0 10px 25px rgba(0, 255, 128, 0.25);
        }

        .gradientButton.secondary {
            background: linear-gradient(135deg, var(--emojiblue), var(--emojipurple));
            color: white;
            box-shadow: 0 10px 25px rgba(59, 136, 195, 0.25);
        }

        .gradientButton:hover, .gradientButton:focus-visible {
            transform: translateY(-2px);
            filter: brightness(110%);
        }

        .gradientButton:active {
            transform: translateY(0px);
        }

        .gradientButton:disabled {
            cursor: not-allowed;
            opacity: 60%;
            filter: saturate(40%);
            transform: none;
        }
    </style>
</head>
<body>
    <div class="heroWrap middleflex">
        <img class="heroBgLogo" src="https://images-ext-1.discordapp.net/external/vsh7pbxkoonbodZ8hUBafIy4eiJ6oKGEZKgZcADdfkg/%3Fsize%3D2048/https/cdn.discordapp.com/icons/1093864130030612521/aaa49d9f23bce2e8b18a417cfab2b72a.png?format=webp&amp;quality=lossless" alt="">
        <div class="heroCard">
            <div class="heroLogoWrap">
                <img src="https://images-ext-1.discordapp.net/external/vsh7pbxkoonbodZ8hUBafIy4eiJ6oKGEZKgZcADdfkg/%3Fsize%3D2048/https/cdn.discordapp.com/icons/1093864130030612521/aaa49d9f23bce2e8b18a417cfab2b72a.png?format=webp&amp;quality=lossless" alt="Logo de TS Community">
            </div>
            <h1 class="heroTitle">TS Community</h1>
            <p class="heroSubtitle">Panel de niveles de TS Community.</p>
            <div id="buttonList" class="heroButtons">
                <a style="display: none" href="./invite" tabindex="-1" target="_blank" id="addLink"> <button class="gradientButton primary">Añadir a Discord</button> </a>
                <a style="display: none" href="./servers" tabindex="-1" id="manageLink">
                    <button class="gradientButton secondary" id="manageButton" disabled>
                        <svg viewBox="0 0 640 512" fill="currentColor" aria-hidden="true"><path d="M524.5 69.8a1.5 1.5 0 0 0 -.8-.7A485.1 485.1 0 0 0 404.1 32a1.8 1.8 0 0 0 -1.9 .9 337.5 337.5 0 0 0 -14.9 30.6 447.8 447.8 0 0 0 -134.4 0 309.5 309.5 0 0 0 -15.1-30.6 1.9 1.9 0 0 0 -1.9-.9A483.7 483.7 0 0 0 116.1 69.1a1.7 1.7 0 0 0 -.8 .7C39.1 183.7 18.2 294.7 28.4 404.4a2 2 0 0 0 .8 1.4A487.7 487.7 0 0 0 176 479.9a1.9 1.9 0 0 0 2.1-.7A348.2 348.2 0 0 0 208.1 430.4a1.9 1.9 0 0 0 -1-2.6 321.2 321.2 0 0 1 -45.9-21.9 1.9 1.9 0 0 1 -.2-3.1c3.1-2.3 6.2-4.7 9.1-7.1a1.8 1.8 0 0 1 1.9-.3c96.2 43.9 200.4 43.9 295.5 0a1.8 1.8 0 0 1 1.9 .2c2.9 2.4 6 4.9 9.1 7.2a1.9 1.9 0 0 1 -.2 3.1 301.4 301.4 0 0 1 -45.9 21.8 1.9 1.9 0 0 0 -1 2.6 391.1 391.1 0 0 0 30 48.8 1.9 1.9 0 0 0 2.1 .7A486 486 0 0 0 610.7 405.7a1.9 1.9 0 0 0 .8-1.4C623.7 277.6 590.9 167.5 524.5 69.8zM222.5 337.6c-29 0-52.8-26.6-52.8-59.2S193.1 219.1 222.5 219.1c29.7 0 53.3 26.8 52.8 59.2C275.3 311 251.9 337.6 222.5 337.6zm195.4 0c-29 0-52.8-26.6-52.8-59.2S388.4 219.1 417.9 219.1c29.7 0 53.3 26.8 52.8 59.2C470.7 311 447.5 337.6 417.9 337.6z"/></svg>
                        <span id="manageButtonText">Cargando...</span>
                    </button>
                </a>
            </div>
        </div>
    </div>
</body>

<script type="text/javascript" src="./polaris.js"></script>
<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-135255146-1"></script>

<script>

if (window.location.search.includes("authorized")) {
    let savedURL = localStorage.polaris_url
    if (savedURL && savedURL.startsWith("/")) window.location.href = savedURL
    else window.history.pushState("", "", './')
}
delete localStorage.polaris_url

Fetch("./api/loggedin").then(data => {
    if (data && data.login && data.login.id) $('#manageButtonText').text("Gestionar servidores");
    else $('#manageButtonText').text("Iniciar sesión");
    $('#manageButton').prop('disabled', false);
    if (data && data.botPublic) $("#addLink").show();
    $('#manageLink').show()
}).catch(() => {
    $('#manageButtonText').text("Iniciar sesión");
    $('#manageButton').prop('disabled', false);
    $('#manageLink').show()
})

$(document).ready(function(){
    $(this).scrollTop(0);
});

</script>

</html>
