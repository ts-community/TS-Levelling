<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="/css/polaris.css" type="text/css" rel="stylesheet">
    <link rel="icon" href="https://images-ext-1.discordapp.net/external/vsh7pbxkoonbodZ8hUBafIy4eiJ6oKGEZKgZcADdfkg/%3Fsize%3D2048/https/cdn.discordapp.com/icons/1093864130030612521/aaa49d9f23bce2e8b18a417cfab2b72a.png?format=webp&amp;quality=lossless">
    <title>Página no encontrada</title>
    <meta property="og:title" content="TS Community">
    <meta property="og:description" content="Esta página no existe">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#00ff80">
    <meta name="twitter:card" content="summary">
    <meta name="robots" content="noindex">
    <style>
        body {
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 128, 0.16), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(59, 136, 195, 0.18), transparent 45%),
                var(--bg);
        }

        .heroWrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .heroBgLogo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 900px;
            height: 900px;
            object-fit: cover;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            filter: blur(90px);
            opacity: 30%;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .heroCard {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 55px 65px;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        .heroLogoWrap {
            padding: 4px;
            border-radius: 50%;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--polarisgreen), var(--emojiblue));
            box-shadow: 0 0 40px rgba(0, 255, 128, 0.35);
        }

        .heroLogoWrap img {
            display: block;
            height: 100px;
            width: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--bg);
            user-select: none;
        }

        .errorCode {
            font-family: var(--opensans);
            font-weight: 800;
            font-size: 72px;
            line-height: 1;
            margin: 0px 0px 8px 0px;
            background: linear-gradient(135deg, var(--polarisgreen), var(--emojiblue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .heroTitle {
            font-family: var(--opensans);
            font-weight: 800;
            font-size: 26px;
            margin: 0px 0px 12px 0px;
            color: white;
        }

        .heroSubtitle {
            font-size: 16px;
            line-height: 26px;
            margin: 0px 0px 32px 0px;
            opacity: 70%;
        }

        .gradientButton {
            font-family: var(--opensans);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            min-width: 170px;
            padding: 0px 26px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            color: #0b1210;
            text-decoration: none !important;
            cursor: pointer;
            background: linear-gradient(135deg, var(--polarisgreen), #00c48c);
            box-shadow: 0 10px 25px rgba(0, 255, 128, 0.25);
            transition-duration: 0.2s;
            transition-property: transform, box-shadow, filter;
        }

        .gradientButton:hover, .gradientButton:focus-visible {
            transform: translateY(-2px);
            filter: brightness(110%);
        }

        .gradientButton:active {
            transform: translateY(0px);
        }
    </style>
</head>
<body>
    <div class="heroWrap middleflex">
        <img class="heroBgLogo" src="https://images-ext-1.discordapp.net/external/vsh7pbxkoonbodZ8hUBafIy4eiJ6oKGEZKgZcADdfkg/%3Fsize%3D2048/https/cdn.discordapp.com/icons/1093864130030612521/aaa49d9f23bce2e8b18a417cfab2b72a.png?format=webp&amp;quality=lossless" alt="">
        <div class="heroCard">
            <div class="heroLogoWrap">
                <img src="https://images-ext-1.discordapp.net/external/vsh7pbxkoonbodZ8hUBafIy4eiJ6oKGEZKgZcADdfkg/%3Fsize%3D2048/https/cdn.discordapp.com/icons/1093864130030612521/aaa49d9f23bce2e8b18a417cfab2b72a.png?format=webp&amp;quality=lossless" alt="Logo de TS Community">
            </div>
            <p class="errorCode">404</p>
            <h1 class="heroTitle">Esta página no existe</h1>
            <p class="heroSubtitle">Puede que el enlace esté roto o que la página se haya movido.</p>
            <a href="/">
                <button class="gradientButton">Volver al inicio</button>
            </a>
        </div>
    </div>
</body>

<script type="text/javascript" src="/polaris.js"></script>
<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-135255146-1"></script>

</html>
